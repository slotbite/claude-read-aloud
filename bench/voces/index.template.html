<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banco de voces</title>
<style>
:root{--bg:#fafafa;--fg:#1c1c1e;--mut:#6b6b70;--card:#fff;--bd:#dcdce0;--ac:#2f6fed;--star:#e0a100;--ok:#1f8a4c;--bad:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#161618;--fg:#e8e8ea;--mut:#9a9aa2;--card:#1f1f23;--bd:#34343a;--ac:#6b9bff;--star:#f0b400;--ok:#4cc98a;--bad:#ff7a6b}}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif;max-width:1400px;margin-inline:auto}
h1{margin:.2em 0}h2{margin:1.6em 0 .2em;font-size:1.1em}
.mut{color:var(--mut)}
table{border-collapse:collapse;width:100%;background:var(--card);border:1px solid var(--bd)}
th,td{padding:6px 10px;border-bottom:1px solid var(--bd);text-align:left;font-size:.9em}
th{color:var(--mut);font-weight:600}
.scroll{overflow-x:auto}
.texto{margin:.2em 0 .6em;font-style:italic}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px}
.card b{display:block}
audio{width:100%;margin:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px}
.chip{background:var(--bg);border:1px solid var(--bd);border-radius:99px;padding:0 8px;font-size:.78em;color:var(--mut)}
.stars button{background:none;border:0;font-size:1.4em;line-height:1;cursor:pointer;color:var(--bd);padding:0 2px}
.stars button.on{color:var(--star)}
button.exp{background:var(--ac);color:#fff;border:0;border-radius:6px;padding:6px 12px;cursor:pointer}
.err{color:var(--bad);font-size:.85em}
.falta{color:var(--mut);font-size:.85em}
.filtros{position:sticky;top:0;z-index:1;background:var(--bg);border-bottom:1px solid var(--bd);padding:8px 0;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.filtros label{display:inline-flex;gap:4px;align-items:center;font-size:.9em}
.filtros select,.filtros input[type=search]{background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:4px 8px;font:inherit}
.filtros input[type=search]{min-width:0;width:180px}
.idioma{font-size:.75em;border-radius:4px;padding:0 6px;margin-left:6px;vertical-align:middle;border:1px solid var(--bd)}
.idioma.es{color:var(--ok);border-color:var(--ok)}
.idioma.otro{color:var(--bad);border-color:var(--bad)}
.oculto{display:none}
</style>
</head>
<body>
<h1>Banco de voces</h1>
<p class="mut">Mismos textos, cada modelo/voz. Puntúa de 1 a 5 estrellas (se guarda en este navegador).
 <button class="exp" id="exp">Exportar votos</button></p>
<h2>Resumen</h2>
<div class="scroll"><table id="resumen"></table></div>
<div id="refs"></div>
<div class="filtros" id="filtros">
  <label>Voz <select id="f-idioma">
    <option value="es">Solo español (nativas y clones)</option>
    <option value="es+multi">Español + multilingües</option>
    <option value="todas">Todas</option>
  </select></label>
  <span id="f-modelos"></span>
  <label><input type="search" id="f-buscar" placeholder="Buscar modelo o voz"></label>
  <span class="mut" id="f-cuenta"></span>
</div>
<div id="textos"></div>
<script>
const D = /*DATOS*/null;
const $ = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.textContent = h; return e; };
const KEY = "banco-voces-votos";
let votos = {};
try { votos = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
const guardar = () => { try { localStorage.setItem(KEY, JSON.stringify(votos)); } catch (e) {} };
const fmt = (v, u = "") => v == null ? "—" : v + u;

// Idioma de origen de cada voz (verificado en el código de cada paquete).
// es = grabada/entrenada en español o clonada de una voz española; multi = voz
// sin idioma propio que lee en el idioma pedido; en/pt = voz de otro idioma.
const IDIOMA_VOZ = {
  "kokoro/ef_dora": "es", "kokoro/em_alex": "es",
  "supertonic/F1": "multi", "supertonic/M1": "multi",
  "pocket/preset_lola": "es", "pocket/preset_rafael": "pt", "pocket/preset_alba": "en",
  "pocket/clon_ef_dora": "es",
  "omnivoice/auto": "multi", "omnivoice/clon_ef_dora": "es",
};
// Los clones de importar_refs.py traen su idioma en meta.idiomas.
const idiomaDe = (m, v) => IDIOMA_VOZ[`${m.modelo}/${v}`] || (m.meta.idiomas || {})[v] || "?";
const ETIQUETA = { es: "español", multi: "multilingüe", en: "inglés", pt: "portugués", "?": "sin dato" };

// tabla resumen
const t = document.getElementById("resumen");
const cab = ["Modelo", "Voces", "Tamaño", "Carga", "RTF medio", "1.er audio", "VRAM pico", "Disp.", "Licencia"];
t.appendChild(Object.assign($("tr"), {})).append(...cab.map(c => $("th", "", c)));
for (const m of D.modelos) {
  const r = m.resumen, tr = $("tr");
  const errs = Object.entries(m.meta.errores || {});
  tr.append($("td", "", m.modelo), $("td", "", r.voces.join(", ")), $("td", "", fmt(m.meta.tamano_mb, " MB")),
    $("td", "", fmt(m.meta.carga_s, " s")), $("td", "", fmt(r.rtf_medio)), $("td", "", fmt(r.primer_audio_s, " s")),
    $("td", "", fmt(r.vram_mb, " MB")), $("td", "", fmt(m.meta.dispositivo)), $("td", "", fmt(m.meta.licencia)));
  t.appendChild(tr);
  for (const [v, e] of errs) {
    const er = $("tr"), td = $("td", "err", `${m.modelo}/${v} falló: ${e.slice(0, 160)}`);
    td.colSpan = cab.length; er.appendChild(td); t.appendChild(er);
  }
}

// referencias originales de los clones, para comparar
if (D.refs && Object.keys(D.refs).length) {
  const box = document.getElementById("refs");
  box.appendChild($("h2", "", "Referencias de clonación (10 s originales)"));
  const g = $("div", "grid");
  for (const [p, r] of Object.entries(D.refs)) {
    const c = $("div", "card"), tit = $("b", "", `clon_${p}`);
    tit.appendChild($("span", "idioma " + (r.idioma === "es" ? "es" : "otro"), ETIQUETA[r.idioma] || r.idioma));
    const a = $("audio"); a.controls = true; a.preload = "none"; a.src = `ref/clones/${p}.wav`;
    c.append(tit, a, $("div", "chips"));
    c.lastChild.append($("span", "chip", `${r.pct_habla} % habla`), $("span", "chip", r.origen.split("/").pop()));
    if (r.texto) c.appendChild($("p", "mut", `«${r.texto}»`));
    g.appendChild(c);
  }
  box.appendChild(g);
}

// textos × modelo/voz
const cont = document.getElementById("textos");
for (const [tid, tx] of Object.entries(D.textos)) {
  cont.appendChild($("h2", "", `${tid} · ${tx.nombre}`));
  cont.appendChild($("p", "texto", tx.texto));
  const g = $("div", "grid");
  for (const m of D.modelos) {
    for (const f of m.filas.filter(f => f.texto === tid)) {
      const id = `${m.modelo}/${f.voz}/${tid}`, c = $("div", "card");
      const idi = idiomaDe(m, f.voz);
      c.dataset.modelo = m.modelo; c.dataset.voz = f.voz; c.dataset.idioma = idi;
      const tit = $("b", "", `${m.modelo} · ${f.voz}`);
      tit.appendChild($("span", "idioma " + (idi === "es" ? "es" : idi === "multi" ? "" : "otro"), ETIQUETA[idi]));
      c.appendChild(tit);
      const a = $("audio"); a.controls = true; a.preload = "none"; a.src = `out/${m.modelo}/${f.voz}/${tid}.wav`;
      c.appendChild(a);
      const ch = $("div", "chips");
      for (const s of [`RTF ${f.rtf}`, `sint ${f.sintesis_s} s`, `audio ${f.duracion_s} s`,
          f.primer_audio_s != null ? `1.er audio ${f.primer_audio_s} s` : null, f.vram_mb ? `VRAM ${f.vram_mb} MB` : null, f.dispositivo])
        if (s) ch.appendChild($("span", "chip", s));
      c.appendChild(ch);
      const st = $("div", "stars");
      const pintar = () => st.childNodes.forEach((b, i) => b.classList.toggle("on", i < (votos[id] || 0)));
      for (let n = 1; n <= 5; n++) {
        const b = $("button", "", "★"); b.title = n + " de 5";
        b.onclick = () => { votos[id] = votos[id] === n ? 0 : n; guardar(); pintar(); };
        st.appendChild(b);
      }
      pintar(); c.appendChild(st); g.appendChild(c);
    }
  }
  cont.appendChild(g);
}

// filtros (se recuerdan en este navegador)
const FKEY = "banco-voces-filtros";
let F = { idioma: "es", fuera: [], q: "" };
try { Object.assign(F, JSON.parse(localStorage.getItem(FKEY) || "{}")); } catch (e) {}
const selIdioma = document.getElementById("f-idioma"), buscar = document.getElementById("f-buscar");
selIdioma.value = F.idioma; buscar.value = F.q;
const cajaModelos = document.getElementById("f-modelos");
for (const m of D.modelos) {
  const lb = $("label"), cb = $("input");
  cb.type = "checkbox"; cb.checked = !F.fuera.includes(m.modelo);
  cb.onchange = () => { F.fuera = cb.checked ? F.fuera.filter(x => x !== m.modelo) : [...F.fuera, m.modelo]; aplicar(); };
  lb.append(cb, m.modelo); cajaModelos.appendChild(lb);
}
const PERMITIDOS = { es: ["es"], "es+multi": ["es", "multi"], todas: null };
function aplicar() {
  F.idioma = selIdioma.value; F.q = buscar.value.trim().toLowerCase();
  try { localStorage.setItem(FKEY, JSON.stringify(F)); } catch (e) {}
  const ok = PERMITIDOS[F.idioma];
  const vistas = new Set();
  for (const c of document.querySelectorAll("#textos .card")) {
    const ve = (!ok || ok.includes(c.dataset.idioma)) && !F.fuera.includes(c.dataset.modelo)
      && (!F.q || `${c.dataset.modelo} ${c.dataset.voz}`.toLowerCase().includes(F.q));
    c.classList.toggle("oculto", !ve);
    if (ve) vistas.add(`${c.dataset.modelo}/${c.dataset.voz}`);
    if (!ve) c.querySelector("audio")?.pause();
  }
  document.getElementById("f-cuenta").textContent = `${vistas.size} voces visibles`;
}
selIdioma.onchange = aplicar; buscar.oninput = aplicar;
aplicar();

document.getElementById("exp").onclick = () => {
  const blob = new Blob([JSON.stringify(votos, null, 1)], { type: "application/json" });
  const a = $("a"); a.href = URL.createObjectURL(blob); a.download = "votos-voces.json"; a.click();
};
</script>
</body>
</html>
